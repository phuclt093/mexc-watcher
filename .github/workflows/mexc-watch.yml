name: MEXC Launchpool Watcher

on:
  schedule:
    # 10 phut/lan (gio UTC). GitHub co the tre vai phut khi tai cao - binh thuong.
    - cron: "*/10 * * * *"
  workflow_dispatch:        # cho phep bam chay tay tu tab Actions

concurrency:
  group: mexc-watch
  cancel-in-progress: false

permissions:
  contents: write           # can de commit nguoc seen.json

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check MEXC announcements
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python mexc_watch.py

      - name: Check exchange token burns
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python burn_watch.py

      - name: Save state
        if: always()
        run: |
          git config user.name  "mexc-watcher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A seen.json burn.json docs/data 2>/dev/null || git add seen.json || exit 0
          git diff --staged --quiet && echo "khong co thay doi" && exit 0
          git commit -m "chore: update seen state [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          echo "push that bai" && exit 1
